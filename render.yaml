services:
  - type: web
    name: mindshield-ai
    env: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && python run.py"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_MODE
        value: mock
      - key: DATABASE_URL
        value: sqlite:///./mindshield.db
